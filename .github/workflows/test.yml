name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: install lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: syntax check
        run: lua5.4 -e "assert(loadfile('ghfind.lua'))" && echo ok

      - name: menu exits cleanly on EOF
        run: |
          printf '0\n' | lua5.4 ghfind.lua

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐣 ghfind — github repo searcher</title>
<meta name="description" content="A tiny cute GitHub repo searcher — pure Lua, single file, no deps.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<meta property="og:title" content="🐣 ghfind">
<meta property="og:description" content="a tiny cute github repo searcher — pure lua">
<meta property="og:type" content="website">
<meta property="og:url" content="https://7helix.github.io/ghfind/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header><div class="wrap">
  <h1>🐣 ghfind</h1>
  <p class="tagline">a tiny cute github repo searcher — pure lua</p>
  <p class="badges">
    <span class="badge">pure lua</span>
    <span class="badge">no deps</span>
    <span class="badge">single file</span>
    <span class="badge">MIT</span>
  </p>
</div></header>

<main class="wrap">

  <section class="finder">
    <div class="bar">
      <input id="q" type="text" placeholder="search github repos…" autocomplete="off" spellcheck="false">
      <button id="go" aria-label="search">🔎</button>
    </div>

    <div class="filters">
      <div class="chips" id="langs">
        <button class="chip on" data-v="">any</button>
        <button class="chip" data-v="lua">lua</button>
        <button class="chip" data-v="python">python</button>
        <button class="chip" data-v="rust">rust</button>
        <button class="chip" data-v="go">go</button>
        <button class="chip" data-v="javascript">js</button>
        <button class="chip" data-v="typescript">ts</button>
        <button class="chip" data-v="c">c</button>
        <button class="chip" data-v="c++">c++</button>
        <button class="chip" data-v="zig">zig</button>
      </div>
      <div class="chips right" id="sorts">
        <button class="chip on" data-v="">best</button>
        <button class="chip" data-v="stars">⭐ stars</button>
        <button class="chip" data-v="forks">🍴 forks</button>
        <button class="chip" data-v="updated">🕒 fresh</button>
      </div>
    </div>

    <div class="suggest">
      <span class="lbl">try →</span>
      <button class="tag" data-q="neovim colorscheme">neovim colorscheme</button>
      <button class="tag" data-q="tui file manager">tui file manager</button>
      <button class="tag" data-q="http server">http server</button>
      <button class="tag" data-q="markdown parser">markdown parser</button>
      <button class="tag" data-q="terminal game">terminal game</button>
      <button class="tag" data-q="lua binding">lua binding</button>
    </div>

    <p id="status" class="status"></p>

    <div id="grid" class="grid"></div>
  </section>

  <section class="install">
    <h2>📥 install the cli</h2>
    <pre><code>curl -O https://raw.githubusercontent.com/7helix/ghfind/main/ghfind.lua
chmod +x ghfind.lua
lua ghfind.lua "neovim colorscheme" --sort stars</code></pre>
  </section>

</main>

<footer><div class="wrap">
  <p><a href="https://github.com/7helix/ghfind">github</a> · MIT · made with 🐣</p>
</div></footer>

<script>
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M'
              : n >= 1e3 ? (n/1e3).toFixed(1)+'k'
              : String(n|0);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const state = { lang: '', sort: '', busy: false, demo: true, token: '' };

// ── token (sessionStorage only) ──
state.token = sessionStorage.getItem('ghf_tok') || '';

// ── github ──
async function search(q) {
  const p = new URLSearchParams({ q, per_page: 6 });
  if (state.lang) p.set('q', q + ' language:' + state.lang);
  if (state.sort) { p.set('sort', state.sort); p.set('order', 'desc'); }
  const h = { Accept: 'application/vnd.github+json' };
  if (state.token) h.Authorization = 'Bearer ' + state.token;
  const r = await fetch('https://api.github.com/search/repositories?' + p, { headers: h });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
  return j;
}

// ── render ──
function card(r, i) {
  const c = document.createElement('a');
  c.className = 'card';
  c.href = r.html_url;
  c.target = '_blank';
  c.rel = 'noopener';
  c.style.animationDelay = (i * 40) + 'ms';
  c.innerHTML = `
    <div class="card-head">
      <img class="avatar" src="${esc(r.owner?.avatar_url || '')}" alt="" loading="lazy">
      <span class="repo">${esc(r.full_name)}</span>
    </div>
    <p class="desc">${esc(r.description || '—')}</p>
    <div class="card-foot">
      ${r.language ? `<span class="pill">${esc(r.language)}</span>` : ''}
      <span class="metric">⭐ ${fmt(r.stargazers_count)}</span>
      <span class="metric">🍴 ${fmt(r.forks_count)}</span>
      <span class="metric dim">${(r.updated_at||'').slice(0,10)}</span>
    </div>`;
  return c;
}

function render(data) {
  const grid = $('#grid');
  grid.innerHTML = '';
  const items = data.items || [];
  if (!items.length) {
    grid.innerHTML = '<p class="empty">🫧 nothing found. try softer words?</p>';
    return;
  }
  items.slice(0, 6).forEach((r, i) => grid.appendChild(card(r, i)));
}

// ── run one search ──
async function run(q) {
  if (state.busy || !q.trim()) return;
  state.busy = true;
  $('#status').textContent = '🔎 searching…';
  $('#status').classList.remove('err');
  $('#grid').innerHTML = '';
  try {
    const data = await search(q.trim());
    $('#status').textContent = `${fmt(data.total_count)} repos · showing ${Math.min(data.items.length, 6)}`;
    render(data);
  } catch (e) {
    $('#status').textContent = '😾 ' + e.message;
    $('#status').classList.add('err');
  } finally {
    state.busy = false;
  }
}

// ── typewriter ──
async function typeInto(inp, text) {
  inp.value = '';
  for (const ch of text) {
    if (!state.demo) return;
    inp.value += ch;
    await sleep(45 + Math.random() * 40);
  }
}

// ── auto-playing demo ──
const DEMOS = [
  { q: 'neovim colorscheme',  lang: '',        sort: 'stars' },
  { q: 'tui file manager',    lang: '',        sort: 'stars' },
  { q: 'http server',         lang: 'lua',     sort: 'stars' },
  { q: 'markdown parser',     lang: 'rust',    sort: 'stars' },
  { q: 'terminal game',       lang: 'c',       sort: 'stars' },
  { q: 'web framework',       lang: 'zig',     sort: 'updated' }
];

async function demoLoop() {
  await sleep(700);
  while (state.demo) {
    for (const d of DEMOS) {
      if (!state.demo) return;
      // set filters
      setChip('#langs', d.lang);
      setChip('#sorts', d.sort);
      state.lang = d.lang;
      state.sort = d.sort;

      await typeInto($('#q'), d.q);
      if (!state.demo) return;
      await sleep(250);
      await run(d.q);
      if (!state.demo) return;
      await sleep(3200);
    }
  }
}

function stopDemo() {
  if (!state.demo) return;
  state.demo = false;
  document.body.classList.add('interactive');
}

function setChip(sel, val) {
  $$(sel + ' .chip').forEach(c => c.classList.toggle('on', c.dataset.v === val));
}

// ── wire up ──
$('#go').addEventListener('click', () => { stopDemo(); run($('#q').value); });
$('#q').addEventListener('keydown', e => {
  stopDemo();
  if (e.key === 'Enter') run($('#q').value);
});
$('#q').addEventListener('focus', stopDemo);
$('#q').addEventListener('input', stopDemo);

$$('#langs .chip').forEach(c => c.addEventListener('click', () => {
  stopDemo();
  state.lang = c.dataset.v;
  setChip('#langs', c.dataset.v);
  if ($('#q').value.trim()) run($('#q').value);
}));

$$('#sorts .chip').forEach(c => c.addEventListener('click', () => {
  stopDemo();
  state.sort = c.dataset.v;
  setChip('#sorts', c.dataset.v);
  if ($('#q').value.trim()) run($('#q').value);
}));

$$('.tag').forEach(t => t.addEventListener('click', () => {
  stopDemo();
  $('#q').value = t.dataset.q;
  run(t.dataset.q);
}));

// ── boot ──
demoLoop();
</script>

</body>
</html>
